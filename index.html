<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vessel Data Updater</title>
    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; shadow: 0 4px 12px rgba(0,0,0,0.1); width: 400px; }
        .box { margin-bottom: 20px; padding: 15px; border: 2px dashed #ccc; border-radius: 8px; text-align: center; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h1>Welcome, Xu Zhi Jun</h1>
    <div class="box">
        <label>1. Main Excel Sheet:</label>
        <input type="file" id="excel_in">
    </div>
    <div class="box">
        <label>2. WinDB CSV:</label>
        <input type="file" id="csv_in">
    </div>
    <button id="run_btn">Process & Download</button>
    <div id="status" style="margin-top:15px;"></div>
</div>

<script type="py" config='{"packages": ["pandas", "openpyxl"]}'>
import pandas as pd
import io
from pyscript import document, window
from js import Uint8Array, Blob, URL

def clean(val):
    val = str(val).strip()
    if val.endswith('.0'): val = val[:-2]
    return val.replace(' 00:00:00', '')

async def run_update(event):
    status = document.querySelector("#status")
    status.innerText = "Processing..."
    
    # Get files from JS
    excel_file = window.document.getElementById("excel_in").files.item(0)
    csv_file = window.document.getElementById("csv_in").files.item(0)
    
    # Read into memory
    sheet_df = pd.read_excel(io.BytesIO(await excel_file.arrayBuffer()))
    db_df = pd.read_csv(io.BytesIO(await csv_file.text().encode('utf-8')))
    
    # Logic
    db_df['CLEAN_KEY'] = db_df['DB Number'].apply(clean)
    db_indexed = db_df.set_index('CLEAN_KEY')
    
    count = 0
    for i in range(len(sheet_df)):
        k1 = clean(sheet_df.iloc[i, 6])
        k2 = clean(sheet_df.iloc[i, 7])
        
        match = None
        if k1 in db_indexed.index: match = db_indexed.loc[k1]
        elif k2 in db_indexed.index: match = db_indexed.loc[k2]
        
        if match is not None:
            if isinstance(match, pd.DataFrame): match = match.iloc[0]
            sheet_df.iloc[i, 0] = match.get('Vessel_Name', sheet_df.iloc[i, 0])
            sheet_df.iloc[i, 2] = match.get('IMO_Number', sheet_df.iloc[i, 2])
            sheet_df.iloc[i, 4] = clean(match.get('Handover_Date', sheet_df.iloc[i, 4]))
            sheet_df.iloc[i, 8] = clean(match.get('Shop_Test_Date', sheet_df.iloc[i, 8]))
            count += 1
            
    # Export
    output = io.BytesIO()
    sheet_df.to_excel(output, index=False)
    
    # Download
    blob = Blob.new([output.getvalue()], {type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})
    url = URL.createObjectURL(blob)
    link = window.document.createElement("a")
    link.href = url
    link.download = "sheet_updated_audited.xlsx"
    link.click()
    
    status.innerText = f"Success! Updated {count} rows."

document.querySelector("#run_btn").addEventListener("click", run_update)
</script>

</body>
</html>
